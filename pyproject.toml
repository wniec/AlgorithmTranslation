[project]
name = "algorithm-translation"
version = "0.1.0"
description = "Learned translation of internal state between metaheuristic optimizers (PSO, CMA-ES) on COCO-BBOB"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ioh>=0.3.0",
    "pypop7>=0.0.82,<0.0.83",
    "numpy>=1.20.0,<2.0",
    "torch>=2.0.0",
    "tqdm>=4.67.1,<5",
    "rich>=15.0.0",
    "gymnasium>=0.29",
    "wandb>=0.27.2",
    "python-dotenv>=1.2.2",
    "pflacco>=1.0.0",
    "pandas>=2.0.3",
]

[project.scripts]
train = "algorithm_translation.cli.train_ppo:main"
train-td3 = "algorithm_translation.cli.train_td3:main"
eval = "algorithm_translation.cli.evaluate:main"
eval-switch = "algorithm_translation.cli.evaluate_switcher:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A thorough set beyond ruff's minimal default (E4/E7/E9 + F): pycodestyle
# (E/W), pyflakes (F), import sorting (I), bugbear (B), comprehensions (C4),
# pyupgrade (UP), flake8-simplify (SIM), and ruff's own rules (RUF).
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    # `int(round(x))` is intentional: round() on a numpy scalar returns a numpy
    # float, so the int() guarantees a Python int for use as a count/size.
    "RUF046",
]

[tool.ruff.lint.isort]
# Pin `algorithm_translation` as first-party. Ruff's auto-detection classifies algorithm_translation.* differently
# depending on whether the project is installed in the env (editable locally vs
# a fresh `uv sync` in CI), which made import sorting pass locally but fail in
# CI. Declaring it explicitly makes the ordering deterministic everywhere.
known-first-party = ["algorithm_translation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithm_translation"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that use real IOH/pypop7 (slower)",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.5",
]
