name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Pull CPU-only torch wheels: the default Linux wheel is the multi-GB CUDA
      # build, which the CI runner has no GPU for and which blows out the cache.
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true          # cache the uv download/package cache across runs
          python-version: "3.11"      # matches requires-python (>=3.11,<3.12)

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml, so CI
        # installs exactly the resolved, committed dependency set (dev group
        # included by default: ruff + pytest).
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q
